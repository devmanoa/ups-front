<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UPS — Console d'expédition</title>
    <!--
      Configuration injectée au démarrage du conteneur.
      Absent en développement local : le repli sur VITE_API_URL s'applique.
    -->
    <script src="/config.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark">UPS</span>
        <span class="brand-text">Console d'expédition</span>
      </div>
      <div id="status-badge" class="status-badge status-unknown">Vérification…</div>
    </header>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="tracking">Suivi de colis</button>
      <button class="tab" data-tab="rating">Tarifs</button>
      <button class="tab" data-tab="locator">Points relais</button>
      <button class="tab" data-tab="address">Validation d'adresse</button>
      <button class="tab" data-tab="shipping">Étiquettes</button>
    </nav>

    <main id="app"></main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
