server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Application monopage : toute route inconnue retombe sur index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Les assets Vite portent un hash dans leur nom : cache long sans risque.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # config.js est généré au démarrage : il ne doit jamais être mis en cache,
  # sinon un changement d'URL backend ne serait pas pris en compte.
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
